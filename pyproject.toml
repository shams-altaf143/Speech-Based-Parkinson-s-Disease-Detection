[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auditorynet"
version = "1.0.0"
description = "AuditoryNet: Gammatone-cochleagram CNN for speech-based Parkinson's disease detection"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "torch>=2.0", "numpy>=1.23", "scipy>=1.10", "soundfile>=0.12",
  "scikit-learn>=1.3", "matplotlib>=3.7", "pyyaml>=6.0",
  "streamlit>=1.39", "pandas>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
auditorynet-train = "auditorynet.train:main"
auditorynet-predict = "auditorynet.predict:main"
auditorynet-gui = "auditorynet.gui:main"

[tool.setuptools.packages.find]
where = ["src"]
